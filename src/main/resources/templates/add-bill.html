<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Add Bill</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<div class="container mt-4">

    <h2>Generate Bill</h2>

    <form th:action="@{/save-bill}"
          th:object="${billing}"
          method="post">

        <div class="mb-3">

            <label>Product Name</label>

            <input type="text"
                   th:field="*{productName}"
                   class="form-control">
        </div>

        <div class="mb-3">

            <label>Price</label>

            <input type="number"
                   th:field="*{price}"
                   class="form-control">
        </div>

        <div class="mb-3">

            <label>Quantity</label>

            <input type="number"
                   th:field="*{quantity}"
                   class="form-control">
        </div>

        <div class="mb-3">

            <label>Bill Date</label>

            <input type="date"
                   th:field="*{billDate}"
                   class="form-control">
        </div>

        <button type="submit"
                class="btn btn-primary">
            Save Bill
        </button>

    </form>

</div>

</body>
</html>
