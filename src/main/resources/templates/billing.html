<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Billing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

.product-card{

cursor:pointer;

transition:0.3s;

}

.product-card:hover{

transform:scale(1.05);

}

</style>

</head>

<body>
<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI TEA SHOP
</span>

<a href="/"
class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>

<div class="container-fluid mt-3">

<div class="row">

<!-- PRODUCTS -->

<div class="col-md-8">

<h3>Products</h3>

<div class="row">

<div class="col-md-3 mb-3"
     th:each="product : ${products}">

<div class="card product-card shadow"
     th:attr="onclick=|addProduct(${product.id},'${product.name}',${product.price})|">

<div class="card-body text-center">

<h1>☕</h1>

<h5 th:text="${product.name}"></h5>

<p>
₹ <span th:text="${product.price}"></span>
</p>

</div>

</div>

</div>

</div>

</div>

<!-- CART -->

<div class="col-md-4">

<h3>Cart</h3>

<table class="table table-bordered">

<thead>

<tr>
<th>Item</th>
<th>Qty</th>
<th>Total</th>
<th></th>
</tr>

</thead>

<tbody id="cartBody">

</tbody>

</table>

<h3>

Grand Total :

₹ <span id="grandTotal">0</span>

</h3>

<button class="btn btn-success"
        onclick="saveBill()">

Save Order

</button>

</div>

</div>

</div>

<script>

let cart=[];

function addProduct(id,name,price){

let item=
cart.find(
x=>x.productId===id
);

if(item){

item.quantity++;

item.totalPrice=
item.quantity*item.price;

}
else{

cart.push({

productId:id,
productName:name,
price:price,
quantity:1,
totalPrice:price

});

}

renderCart();

}

function renderCart(){

let rows="";

let total=0;

cart.forEach((item,index)=>{

total+=item.totalPrice;

rows+=`

<tr>

<td>
${item.productName}
</td>

<td>
${item.quantity}
</td>

<td>
${item.totalPrice}
</td>

<td>

<button
class="btn btn-danger btn-sm"
onclick="removeItem(${index})">

X

</button>

</td>

</tr>

`;

});

document
.getElementById("cartBody")
.innerHTML=rows;

document
.getElementById("grandTotal")
.innerHTML=total;

}

function removeItem(index){

cart.splice(index,1);

renderCart();

}

function saveBill(){

if(cart.length===0){

alert("Cart is Empty");

return;

}

fetch('/save-bill',{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify(cart)

})

.then(response => response.text())

.then(data => {

alert(data);

cart=[];

renderCart();

});

}

</script>

</body>
</html>
