<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Billing</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>
<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI TEA SHOP
</span>

<a href="/"
class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>

<div class="container mt-4">

<form action="/save-bill" method="post">

<div class="row">

    <div class="col-md-5">

        <label>Product</label>

        <select name="productId"
                id="productSelect"
                class="form-control"
                onchange="updatePrice()">

            <option value="">Select Product</option>

            <option
                th:each="p : ${products}"
                th:value="${p.id}"
                th:text="${p.name}"
                th:data-price="${p.price}">
            </option>

        </select>

    </div>

    <div class="col-md-3">

        <label>Price</label>

        <input
            type="text"
            id="price"
            class="form-control"
            readonly>

    </div>

    <div class="col-md-2">

        <label>Qty</label>

        <input
            type="number"
            id="qty"
            name="quantity"
            class="form-control"
            value="1"
            onkeyup="calculateTotal()">

    </div>

    <div class="col-md-2">

        <label>Total</label>

        <input
            type="text"
            id="total"
            class="form-control"
            readonly>

    </div>

</div>

<br>

<button class="btn btn-success">
    Save
</button>

</form>

<hr>

<h4>Order Items</h4>

<table class="table table-bordered">

    <thead>

    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Total</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="o : ${orders}">

        <td th:text="${o.productName}"></td>

        <td th:text="${o.price}"></td>

        <td th:text="${o.quantity}"></td>

        <td th:text="${o.totalPrice}"></td>

    </tr>

    </tbody>

</table>

</div>

<script>

function updatePrice(){

    let select =
        document.getElementById("productSelect");

    let option =
        select.options[select.selectedIndex];

    let price =
        option.getAttribute("data-price");

    document.getElementById("price").value =
        price;

    calculateTotal();
}

function calculateTotal(){

    let price =
        document.getElementById("price").value || 0;

    let qty =
        document.getElementById("qty").value || 0;

    document.getElementById("total").value =
        price * qty;
}

</script>

</body>
</html>
