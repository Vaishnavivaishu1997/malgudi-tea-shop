<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Settings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI TEA SHOP
</span>

<a href="/"
class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<div class="d-flex justify-content-between">

<h2>Settings</h2>

<div>



<a href="/add-settings"
class="btn btn-success">
Add Settings
</a>

</div>

</div>

<hr>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Shop Name</th>
<th>Owner</th>
<th>Contact</th>
<th>Low Stock Alert</th>
<th>Landing Page</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="s : ${settings}">

<td th:text="${s.id}"></td>

<td th:text="${s.shopName}"></td>

<td th:text="${s.ownerName}"></td>

<td th:text="${s.contactNumber}"></td>

<td th:text="${s.lowStockAlert}"></td>

<td th:text="${s.landingPage}"></td>

<td>

<a th:href="@{/edit-settings/{id}(id=${s.id})}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{/delete-settings/{id}(id=${s.id})}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
