<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Reports Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 3px 10px rgba(0,0,0,.1);
}

</style>

</head>

<body>
<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI TEA SHOP
</span>

<a href="/"
class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>

<div class="container mt-4">

<div class="d-flex justify-content-between">

<h2>Business Reports</h2>

</div>

<hr>

<div class="row">

<div class="col-md-3">

<div class="card p-3">

<h5>Total Orders</h5>

<h2 th:text="${totalOrders}">
0
</h2>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

<h5>Total Sales</h5>

<h2 class="text-success">

₹ <span th:text="${totalSales}">
0
</span>

</h2>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

<h5>Total Expenses</h5>

<h2 class="text-danger">

₹ <span th:text="${totalExpenses}">
0
</span>

</h2>

</div>

</div>

<div class="col-md-3">

<div class="card p-3">

<h5>Profit</h5>

<h2 class="text-primary">

₹ <span th:text="${profit}">
0
</span>

</h2>

</div>

</div>

</div>

<hr>

<h3>Orders</h3>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Total Amount</th>
<th>Date</th>

</tr>

</thead>

<tbody>

<tr th:each="order : ${orders}">

<td th:text="${order.id}"></td>

<td th:text="${order.totalAmount}"></td>

<td th:text="${order.orderTime}"></td>

</tr>

</tbody>

</table>

<hr>

<h3>Expenses</h3>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Expense</th>
<th>Category</th>
<th>Amount</th>

</tr>

</thead>

<tbody>

<tr th:each="expense : ${expenses}">

<td th:text="${expense.id}"></td>

<td th:text="${expense.expenseName}"></td>

<td th:text="${expense.category}"></td>

<td th:text="${expense.amount}"></td>

</tr>

</tbody>

</table>

</div>

<a href="/reports/download"
   class="btn btn-success">

Download Report

</a>

</body>

</html>
