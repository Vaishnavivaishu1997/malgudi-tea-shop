<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Edit Inventory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-warning">

<h3>Edit Inventory</h3>

</div>

<div class="card-body">

<form action="/save-inventory"
method="post">

<input type="hidden"
name="id"
th:value="${inventory.id}">

<div class="mb-3">

<label>Item Name</label>

<input type="text"
name="itemName"
th:value="${inventory.itemName}"
class="form-control">

</div>

<div class="mb-3">

<label>Quantity</label>

<input type="number"
step="0.01"
name="quantity"
th:value="${inventory.quantity}"
class="form-control">

</div>

<div class="mb-3">

<label>Unit</label>

<input type="text"
name="unit"
th:value="${inventory.unit}"
class="form-control">

</div>

<div class="mb-3">

<label>Minimum Stock</label>

<input type="number"
step="0.01"
name="minimumStock"
th:value="${inventory.minimumStock}"
class="form-control">

</div>

<button class="btn btn-success">
Update
</button>

<a href="/inventory"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>

</html>
