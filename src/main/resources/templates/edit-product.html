<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h3>Edit Product</h3>

<form action="/save-product"
      method="post">

<input type="hidden"
       name="id"
       th:value="${product.id}">

<div class="mb-3">

<label>Name</label>

<input type="text"
       name="name"
       th:value="${product.name}"
       class="form-control">

</div>

<div class="mb-3">

<label>Price</label>

<input type="number"
       step="0.01"
       name="price"
       th:value="${product.price}"
       class="form-control">

</div>

<div class="mb-3">

<label>Stock</label>

<input type="number"
       name="stock"
       th:value="${product.stock}"
       class="form-control">

</div>

<button class="btn btn-success">
Update Product
</button>

<a href="/products"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</body>
</html>
