<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Edit Expense</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-warning">

Edit Expense

</div>

<div class="card-body">

<form action="/save-expense"
method="post">

<input type="hidden"
name="id"
th:value="${expense.id}">

<div class="mb-3">

<label>Expense Name</label>

<input type="text"
name="expenseName"
th:value="${expense.expenseName}"
class="form-control">

</div>

<div class="mb-3">

<label>Category</label>

<input type="text"
name="category"
th:value="${expense.category}"
class="form-control">

</div>

<div class="mb-3">

<label>Amount</label>

<input type="number"
step="0.01"
name="amount"
th:value="${expense.amount}"
class="form-control">

</div>

<div class="mb-3">

<label>Date</label>

<input type="date"
name="expenseDate"
th:value="${expense.expenseDate}"
class="form-control">

</div>

<button class="btn btn-success">

Update

</button>

<a href="/expenses"
class="btn btn-secondary">

Back

</a>

</form>

</div>

</div>

</div>

</body>

</html>
