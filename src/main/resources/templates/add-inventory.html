<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Add Inventory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-success text-white">

<h3>Add Inventory Item</h3>

</div>

<div class="card-body">

<form action="/save-inventory"
method="post">

<div class="mb-3">

<label>Item Name</label>

<input type="text"
name="itemName"
class="form-control">

</div>

<div class="mb-3">

<label>Quantity</label>

<input type="number"
step="0.01"
name="quantity"
class="form-control">

</div>

<div class="mb-3">

<label>Unit</label>

<input type="text"
name="unit"
class="form-control">

</div>

<div class="mb-3">

<label>Minimum Stock</label>

<input type="number"
step="0.01"
name="minimumStock"
class="form-control">

</div>

<button class="btn btn-success">
Save
</button>

<a href="/inventory"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>

</html>
