<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Add Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Add Product</h3>

</div>

<div class="card-body">

<form action="/save-product"
      method="post">

<div class="mb-3">

<label>Product Name</label>

<input type="text"
       name="name"
       class="form-control">

</div>

<div class="mb-3">

<label>Price</label>

<input type="number"
       step="0.01"
       name="price"
       class="form-control">

</div>

<div class="mb-3">

<label>Stock</label>

<input type="number"
       name="stock"
       class="form-control">

</div>

<button type="submit"
        class="btn btn-success">
Save Product
</button>

<a href="/products"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>
</html>
