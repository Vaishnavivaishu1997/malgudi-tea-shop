<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Malgudi Tea Shop</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0px 2px 10px rgba(0,0,0,.1);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.big-btn{
    height:120px;
    font-size:22px;
    border-radius:20px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI COFFEE & TEA SHOP
</span>

<a href="/logout"
   class="btn btn-danger">
Logout
</a>

</div>

</nav>

<div class="container mt-4">

<h2>Dashboard</h2>

<div class="row mt-4">

<div class="col-md-3 mb-3">

<a href="/billing"
   class="btn btn-success w-100 big-btn">
☕ Billing
</a>

</div>

<div class="col-md-3 mb-3">

<a href="/products"
   class="btn btn-primary w-100 big-btn">
🍪 Products
</a>

</div>

<div class="col-md-3 mb-3">

<a href="/orders"
   class="btn btn-info w-100 big-btn">
📋 Orders
</a>

</div>

<div class="col-md-3 mb-3">

<a href="/inventory"
   class="btn btn-warning w-100 big-btn">
📦 Inventory
</a>

</div>
<div class="col-md-3 mb-3">
<a href="/expenses"
class="btn btn-danger w-100 big-btn">
💰 Expenses
</a>
</div>

<div class="col-md-3 mb-3">

<a href="/reports"
class="btn btn-dark w-100 big-btn">

📊 Reports

</a>

</div>
<div class="col-md-3 mb-3">
<a href="/settings"
class="btn btn-primary w-100 big-btn">
⚙ Settings
</a>
</div>
<div class="row mt-4">

<div class="col-md-4 mb-3">

<div class="card p-4">

<h5>Total Products</h5>

<h2 th:text="${productCount}">
0
</h2>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="card p-4">

<h5>Total Orders</h5>

<h2 th:text="${orderCount}">
0
</h2>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="card p-4">

<h5>Total Sales</h5>

<h2>

₹ <span th:text="${totalSales}">
0
</span>

</h2>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="card p-4">

<h5>Total Expenses</h5>

<h2 class="text-danger">

₹ <span th:text="${totalExpenses}">
0
</span>

</h2>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="card p-4">

<h5>Profit</h5>

<h2 class="text-success">

₹ <span th:text="${profit}">
0
</span>

</h2>

</div>

</div>

<div class="col-md-4 mb-3">

<div class="card p-4">

<h5>Low Stock Items</h5>

<h2 class="text-warning">

<span th:text="${lowStockCount}">
0
</span>

</h2>

</div>

</div>

</div>

</body>

</html>
