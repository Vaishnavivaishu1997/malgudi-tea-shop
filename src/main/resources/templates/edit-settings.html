<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Edit Settings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-warning">

Edit Settings

</div>

<div class="card-body">

<form action="/save-settings"
method="post">

<input type="hidden"
name="id"
th:value="${setting.id}">

<div class="mb-3">

<label>Shop Name</label>

<input type="text"
name="shopName"
th:value="${setting.shopName}"
class="form-control">

</div>

<div class="mb-3">

<label>Owner Name</label>

<input type="text"
name="ownerName"
th:value="${setting.ownerName}"
class="form-control">

</div>

<div class="mb-3">

<label>Contact Number</label>

<input type="text"
name="contactNumber"
th:value="${setting.contactNumber}"
class="form-control">

</div>

<div class="mb-3">

<label>Address</label>

<textarea name="address"
class="form-control"
th:text="${setting.address}">
</textarea>

</div>

<div class="mb-3">

<label>Low Stock Alert</label>

<input type="number"
name="lowStockAlert"
th:value="${setting.lowStockAlert}"
class="form-control">

</div>

<div class="mb-3">

<label>Landing Page</label>

<input type="text"
name="landingPage"
th:value="${setting.landingPage}"
class="form-control">

</div>

<button class="btn btn-success">
Update
</button>

<a href="/settings"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>

</html>
