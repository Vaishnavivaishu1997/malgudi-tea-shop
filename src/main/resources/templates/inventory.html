<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Inventory</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI TEA SHOP
</span>

<a href="/"
class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<div class="d-flex justify-content-between">

<h2>Inventory Management</h2>

<div>


<a href="/add-inventory"
class="btn btn-success">
Add Inventory
</a>

</div>

</div>

<hr>

<div class="alert alert-warning">

<h5>Low Stock Alerts</h5>

<ul>

<li th:each="item : ${items}"
th:if="${item.quantity <= item.minimumStock}">

<strong th:text="${item.itemName}">
Milk
</strong>

is running low.

</li>

</ul>

</div>

<table class="table table-bordered table-striped">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Item Name</th>
<th>Quantity</th>
<th>Unit</th>
<th>Minimum Stock</th>
<th>Status</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="item : ${items}"
th:classappend="${item.quantity <= item.minimumStock} ? 'table-danger' : ''">

<td th:text="${item.id}"></td>

<td th:text="${item.itemName}"></td>

<td th:text="${item.quantity}"></td>

<td th:text="${item.unit}"></td>

<td th:text="${item.minimumStock}"></td>

<td>

<span th:if="${item.quantity <= item.minimumStock}"
class="badge bg-danger">

LOW STOCK

</span>

<span th:if="${item.quantity > item.minimumStock}"
class="badge bg-success">

OK

</span>

</td>

<td>

<a th:href="@{/edit-inventory/{id}(id=${item.id})}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{/delete-inventory/{id}(id=${item.id})}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
