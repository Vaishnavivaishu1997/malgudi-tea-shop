<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Expenses</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>
<nav class="navbar navbar-dark bg-dark">

<div class="container-fluid">

<span class="navbar-brand">
☕ MALGUDI TEA SHOP
</span>

<a href="/"
class="btn btn-secondary">
Dashboard
</a>

</div>

</nav>

<div class="container mt-5">

<div class="d-flex justify-content-between">

<h2>Expense Management</h2>

<div>


<a href="/add-expense"
class="btn btn-success">
Add Expense
</a>

</div>

</div>

<hr>

<div class="alert alert-danger">

<h4>

Total Expenses :
₹ <span th:text="${totalExpense}"></span>

</h4>

</div>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Expense</th>
<th>Category</th>
<th>Amount</th>
<th>Date</th>
<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="expense : ${expenses}">

<td th:text="${expense.id}"></td>

<td th:text="${expense.expenseName}"></td>

<td th:text="${expense.category}"></td>

<td th:text="${expense.amount}"></td>

<td th:text="${expense.expenseDate}"></td>

<td>

<a th:href="@{/edit-expense/{id}(id=${expense.id})}"
class="btn btn-warning btn-sm">

Edit

</a>

<a th:href="@{/delete-expense/{id}(id=${expense.id})}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

</tbody>

</table>

</div>

</body>

</html>
