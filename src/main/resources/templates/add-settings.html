<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Add Settings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<div class="card">

<div class="card-header bg-primary text-white">

Shop Settings

</div>

<div class="card-body">

<form action="/save-settings"
method="post">

<div class="mb-3">

<label>Shop Name</label>

<input type="text"
name="shopName"
class="form-control">

</div>

<div class="mb-3">

<label>Owner Name</label>

<input type="text"
name="ownerName"
class="form-control">

</div>

<div class="mb-3">

<label>Contact Number</label>

<input type="text"
name="contactNumber"
class="form-control">

</div>

<div class="mb-3">

<label>Address</label>

<textarea name="address"
class="form-control"></textarea>

</div>

<div class="mb-3">

<label>Low Stock Alert Value</label>

<input type="number"
name="lowStockAlert"
class="form-control">

</div>

<div class="mb-3">

<label>Landing Page</label>

<select name="landingPage"
class="form-control">

<option>Dashboard</option>
<option>Billing</option>
<option>Orders</option>

</select>

</div>

<button class="btn btn-success">
Save
</button>

<a href="/settings"
class="btn btn-secondary">
Back
</a>

</form>

</div>

</div>

</div>

</body>

</html>
